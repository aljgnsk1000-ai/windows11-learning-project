<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows 11 - مشروع تعليمي</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{height:100vh;overflow:hidden;background:url('https://images.unsplash.com/photo-1622547748225-3fc4abd2cca0?q=80&w=2000') center/cover no-repeat;display:flex;flex-direction:column}
#desktop{flex:1;position:relative;overflow:hidden}
.icon{width:80px;text-align:center;padding:10px 5px;border-radius:6px;cursor:pointer;user-select:none;margin:10px;color:white;text-shadow:0 1px 3px #000}
.icon:hover{background:rgba(255,255,255,0.2)}
#taskbar{height:52px;background:rgba(243,243,243,0.9);backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:center;gap:12px;position:relative;z-index:100}
.task-icon{width:38px;height:38px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px}
.task-icon:hover{background:rgba(0,0,0,0.1)}
#startMenu{position:absolute;bottom:62px;left:50%;transform:translateX(-50%);width:640px;max-width:95vw;height:600px;background:rgba(243,243,243,0.97);backdrop-filter:blur(30px);border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,0.3);display:none;flex-direction:column;padding:24px;z-index:99}
#startMenu.show{display:flex}
.search-box{background:white;border-radius:24px;padding:10px 16px;display:flex;align-items:center;gap:10px;margin-bottom:20px;border:1px solid #e0e0e0}
.search-box input{border:none;outline:none;flex:1;background:transparent}
.apps-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.app{text-align:center;cursor:pointer;padding:10px;border-radius:8px}
.app:hover{background:rgba(0,0,0,0.06)}
.app-icon{width:40px;height:40px;margin:0 auto 6px;background:#0078d4;border-radius:8px;display:flex;align-items:center;justify-content:center;color:white;font-size:20px}
.window{position:absolute;top:80px;left:15%;width:70%;height:65%;background:#f3f3f3;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,0.4);display:none;flex-direction:column;overflow:hidden;border:1px solid #ccc;z-index:10}
.window.show{display:flex}
.titlebar{height:40px;background:#e5e5e5;display:flex;align-items:center;justify-content:space-between;padding:0 12px;cursor:move}
.controls{display:flex}
.controls button{width:46px;height:40px;border:none;background:transparent;cursor:pointer}
.controls button.close:hover{background:#e81123;color:white}
.window-content{flex:1;background:white;padding:20px;overflow:auto}
#time{position:absolute;left:12px;font-size:12px;text-align:right}
</style>
</head>
<body>
<div id="desktop">
<div class="icon" ondblclick="openW('pc')"><div style="font-size:40px">💻</div><span>هذا الجهاز</span></div>
<div class="icon" ondblclick="openW('edge')"><div style="font-size:40px">🌐</div><span>Edge</span></div>
<div class="icon" ondblclick="openW('note')"><div style="font-size:40px">📝</div><span>المفكرة</span></div>
<div class="window" id="win-pc"><div class="titlebar" onmousedown="drag(event,'win-pc')"><span>💻 هذا الجهاز</span><div class="controls"><button onclick="hide('win-pc')">—</button><button onclick="full('win-pc')">☐</button><button class="close" onclick="hide('win-pc')">×</button></div></div><div class="window-content"><h2>مبروك! الويندوز صار يتحرك 🎉</h2><br><p>✅ تقدر تسحب النافذة</p><p>✅ تقدر تكبر وتصغر</p><p>✅ اضغط زر الويندوز تحت</p><br><b>aljgnsk1000-ai</b></div></div>
