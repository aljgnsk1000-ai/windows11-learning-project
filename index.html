<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">
<title>أكاديمية الكمبيوتر</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f7fc;
  color: #182230;
}

header {
  background: linear-gradient(135deg,#087fe8,#005bb5);
  color: white;
  text-align: center;
  padding: 35px 15px;
}

header h1 {
  margin: 0;
  font-size: 32px;
}

header p {
  font-size: 17px;
}

nav {
  background: white;
  display: flex;
  position: sticky;
  top: 0;
  z-index: 10;
  box-shadow: 0 2px 8px #0002;
}

nav a {
  flex: 1;
  padding: 15px 5px;
  text-align: center;
  color: #075da8;
  text-decoration: none;
  font-weight: bold;
}

nav a:hover {
  background: #e9f4ff;
}

section {
  max-width: 900px;
  margin: auto;
  padding: 25px 15px;
}

h2 {
  text-align: center;
  color: #076bbd;
  margin-bottom: 25px;
}

.card {
  background: white;
  margin: 13px 0;
  border-radius: 15px;
  box-shadow: 0 3px 12px #0001;
  overflow: hidden;
}

summary {
  padding: 20px;
  cursor: pointer;
  font-size: 18px;
  font-weight: bold;
  color: #075da8;
  list-style: none;
}

summary::-webkit-details-marker {
  display: none;
}

summary::before {
  content: "＋";
  float: left;
  font-size: 22px;
}

details[open] summary::before {
  content: "−";
}

.answer {
  padding: 5px 20px 20px;
  line-height: 1.9;
  border-top: 1px solid #eee;
}

.grid {
  display: grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));
  gap: 15px;
}

.box {
  background: white;
  padding: 25px 15px;
  text-align: center;
  border-radius: 18px;
  box-shadow: 0 3px 12px #0001;
}

.box a {
  text-decoration: none;
  color: #075da8;
  font-weight: bold;
}

.emoji {
  font-size: 45px;
  margin-bottom: 10px;
}

.window {
  background: white;
  margin-top: 20px;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 3px 12px #0001;
}

.question {
  background: white;
  padding: 20px;
  margin: 15px 0;
  border-radius: 15px;
  box-shadow: 0 3px 12px #0001;
}

.question label {
  display: block;
  padding: 10px;
  margin: 7px 0;
  background: #f0f6fc;
  border-radius: 8px;
}

  border: 0;
  background: #087fe8;
  color: white;
  padding: 14px 25px;
  border-radius: 10px;
  font-size: 17
